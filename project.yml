name: AuraTV
options:
  bundleIdPrefix: local.personal
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  MediaCoreKit:
    path: Packages/MediaCoreKit
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 5.6.2
targets:
  AuraTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources/TVApp
      - path: Sources/TVAdapters
      - path: Sources/PlaybackEngine
    dependencies:
      - package: MediaCoreKit
        product: NetworkVFS
      - package: MediaCoreKit
        product: LocalStreamProxy
      - package: MediaCoreKit
        product: SubtitleKit
      - package: MediaCoreKit
        product: AppPreferences
      - package: AMSMB2
        product: AMSMB2
        embed: true
      - package: KSPlayer
        product: KSPlayer
        embed: true
      - package: KSPlayer
        product: KSPlayerUI
    info:
      path: Sources/TVApp/Info.plist
      properties:
        CFBundleDisplayName: AuraTV
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: "用于发现和访问局域网内的 SMB / WebDAV 视频服务器"
        NSBonjourServices:
          - "_smb._tcp"
          - "_webdav._tcp"
          - "_webdavs._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personal.auratv
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
